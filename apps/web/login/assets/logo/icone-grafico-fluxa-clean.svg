<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36F0FF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo arredondado simples -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0B1628"/>

  <!-- Barras -->
  <g stroke="#E5E7EB" stroke-width="4" stroke-linecap="round">
    <line x1="20" y1="42" x2="20" y2="32"/>
    <line x1="30" y1="42" x2="30" y2="26"/>
    <line x1="40" y1="42" x2="40" y2="30"/>
  </g>

  <!-- Linha crescente -->
  <polyline points="16,34 28,26 40,30 50,18"
            fill="none"
            stroke="url(#lineGrad)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#softGlow)"/>

</svg>
